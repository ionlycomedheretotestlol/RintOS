name: Ship

# Work arrives on a temporary branch. This publishes it: create (or refresh) the release for the
# version in release/VERSION, leaving every other version's release alone, fast-forward main,
# then delete the temporary branch so main stays the only one.
on:
  push:
    branches: ["claude/**"]

permissions:
  contents: write

jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish this version's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(tr -d ' \n' < release/VERSION)
          gh release delete "v$V" --cleanup-tag --yes || true
          gh release create "v$V" "release/RintOS-$V.apk" --target "$GITHUB_SHA" \
            --title "RintOS $V" --notes-file release/NOTES.md --latest
      - name: Fast-forward main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/main" -f sha="$GITHUB_SHA" -F force=false
      - name: Delete the temporary branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$GITHUB_REF_NAME"
