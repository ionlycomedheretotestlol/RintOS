name: Publish release (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.3 release/RintOS-1.3.apk --clobber
          gh release edit v1.3 --notes-file release/NOTES.md
