<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; width: 100%; height: 100%; }
  canvas { display: block; width: 100%; height: 100%; transition: opacity .25s linear; }
</style>
</head>
<body>
<script src="three.min.js"></script>
<script>
// RintOS 1.3 intro — the 3D parts. The clock comes from the app (it follows the music),
// so every cube lands exactly on the beat.
(function () {
  const B = window.RintBridge;
  function fail(msg) { try { B.fail(String(msg)); } catch (e) {} }
  if (!B || !window.THREE) { fail('no bridge or three'); return; }
  let cfg;
  try { cfg = JSON.parse(B.config()); } catch (e) { fail('bad config'); return; }

  const BAR = cfg.bar, BEAT = cfg.beat;
  const ACCENT = new THREE.Color(cfg.accent);
  const WHITE = new THREE.Color(0xffffff);
  const kickBars = new Set(cfg.kickBars);

  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
  } catch (e) { fail('webgl: ' + e); return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000, 0);
  document.body.appendChild(renderer.domElement);
  const canvas = renderer.domElement;

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x02030a, 0.018);
  const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 600);
  window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
  });

  scene.add(new THREE.AmbientLight(0xffffff, 0.45));
  const key = new THREE.DirectionalLight(0xffffff, 0.9); key.position.set(6, 10, 14); scene.add(key);
  const rim = new THREE.PointLight(ACCENT, 3.2, 90); rim.position.set(-10, 4, -6); scene.add(rim);
  const under = new THREE.PointLight(ACCENT, 2.0, 60); under.position.set(0, -8, 8); scene.add(under);

  // ── helpers ──────────────────────────────────────────
  const clamp01 = x => Math.max(0, Math.min(1, x));
  const easeOut = x => 1 - Math.pow(1 - clamp01(x), 3);
  const easeInOut = x => { x = clamp01(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
  const easeOutBack = x => { const c1 = 1.70158, c3 = c1 + 1, p = clamp01(x) - 1; return 1 + c3 * p * p * p + c1 * p * p; };
  const easeOutExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * clamp01(x));
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  function kick(t) {
    const bar = Math.floor(t / BAR);
    if (!kickBars.has(bar)) return 0;
    const ph = t / BEAT - Math.floor(t / BEAT);
    return Math.exp(-ph * 7);
  }

  // stars
  const starGeo = new THREE.BufferGeometry();
  const starPos = new Float32Array(1800 * 3);
  for (let i = 0; i < 1800; i++) {
    const r = 80 + rnd() * 220, th = rnd() * Math.PI * 2, ph = Math.acos(2 * rnd() - 1);
    starPos[i * 3] = r * Math.sin(ph) * Math.cos(th); starPos[i * 3 + 1] = r * Math.cos(ph); starPos[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
  const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.6, sizeAttenuation: true, transparent: true, opacity: 0.8, fog: false }));
  scene.add(stars);

  // voxel words built from the app's own block font
  const cubeGeo = new THREE.BoxGeometry(0.9, 0.9, 0.9);
  // spec: { cells: [[x, y, accent]], w, h } built by the app from its block font
  function voxelWord(spec, cell, depthLayers) {
    const cellsA = spec.cells, widthA = spec.w, heightA = spec.h;
    const n = cellsA.length * depthLayers;
    const mat = new THREE.MeshStandardMaterial({ roughness: 0.35, metalness: 0.15, emissive: 0x000000 });
    const mesh = new THREE.InstancedMesh(cubeGeo, mat, n);
    mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    const data = [];
    let k = 0;
    for (const [cx, cy, acc] of cellsA) {
      for (let z = 0; z < depthLayers; z++) {
        const target = new THREE.Vector3((cx - widthA / 2 + 0.5) * cell, (heightA / 2 - cy - 0.5) * cell, -z * cell);
        const dir = new THREE.Vector3(rnd() - .5, rnd() - .5, rnd() - .5).normalize();
        const start = target.clone().add(dir.multiplyScalar(40 + rnd() * 60));
        data.push({ target, start, spin: new THREE.Euler(rnd() * 6, rnd() * 6, rnd() * 6), delay: rnd(), wave: cx * 0.35 });
        mesh.setColorAt(k, acc ? (z > 0 ? ACCENT.clone().multiplyScalar(0.7) : ACCENT) : (z > 0 ? new THREE.Color(0xc9cfe6) : WHITE));
        k++;
      }
    }
    mesh.instanceColor.needsUpdate = true;
    mesh.userData = { data, cell, w: widthA * cell, h: heightA * cell };
    return mesh;
  }
  const dummy = new THREE.Object3D();
  function placeVoxels(mesh, fn) {
    const d = mesh.userData.data;
    for (let i = 0; i < d.length; i++) { fn(d[i], dummy); dummy.updateMatrix(); mesh.setMatrixAt(i, dummy.matrix); }
    mesh.instanceMatrix.needsUpdate = true;
  }

  // ── scene A: the wordmark assembles in 3D ──
  const groupA = new THREE.Group(); scene.add(groupA);
  const word = voxelWord(cfg.words.STACK, 1, 2);
  word.position.y = 2.2;
  groupA.add(word);
  const ver = voxelWord(cfg.words.VERSION, 0.7, 1);
  ver.position.set(0, -6.6, 0.6); groupA.add(ver);
  const grid = new THREE.GridHelper(220, 110, ACCENT, 0x1a2244); grid.position.y = -9; groupA.add(grid);

  // ── scene B: warp tunnel ──
  const groupB = new THREE.Group(); scene.add(groupB);
  const RINGS = 36, PER = 18, GAP = 7;
  const ringMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1.2, 1.2, 2.6), new THREE.MeshStandardMaterial({ roughness: 0.4, metalness: 0.3, emissive: ACCENT, emissiveIntensity: 0.25 }), RINGS * PER);
  ringMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  for (let i = 0; i < RINGS * PER; i++) ringMesh.setColorAt(i, (Math.floor(i / PER) % 3 === 0) ? ACCENT : WHITE);
  ringMesh.instanceColor.needsUpdate = true;
  groupB.add(ringMesh);
  // feature cards: text drawn onto canvas textures
  function card(text, accent) {
    const c = document.createElement('canvas'); c.width = 1024; c.height = 256;
    const g = c.getContext('2d');
    const r = 90;
    g.fillStyle = accent ? cfg.accent : 'rgba(255,255,255,0.14)';
    g.beginPath(); g.moveTo(r, 0); g.arcTo(1024, 0, 1024, 256, r); g.arcTo(1024, 256, 0, 256, r); g.arcTo(0, 256, 0, 0, r); g.arcTo(0, 0, 1024, 0, r); g.fill();
    g.fillStyle = '#fff'; g.font = '800 92px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(text, 512, 132, 940);
    const tex = new THREE.CanvasTexture(c);
    const m = new THREE.Mesh(new THREE.PlaneGeometry(8, 2), new THREE.MeshBasicMaterial({ map: tex, transparent: true, fog: false }));
    return m;
  }
  const cards = cfg.features.map((f, i) => { const m = card(f, i % 2 === 0); groupB.add(m); return m; });

  // ── scene C: the giant 1.3 ──
  const groupC = new THREE.Group(); scene.add(groupC);
  const big = voxelWord(cfg.words.BIG, 1.6, 2);
  groupC.add(big);
  const orbit = voxelWord(cfg.words.LINE, 0.5, 1);
  groupC.add(orbit);
  const CONF = 320;
  const confetti = new THREE.InstancedMesh(new THREE.PlaneGeometry(0.35, 0.18), new THREE.MeshBasicMaterial({ side: THREE.DoubleSide, fog: false }), CONF);
  const confData = [];
  const palette = [ACCENT, WHITE, new THREE.Color(0xffd60a), new THREE.Color(0xff6fb5), new THREE.Color(0x39ff88)];
  for (let i = 0; i < CONF; i++) {
    confetti.setColorAt(i, palette[i % palette.length]);
    confData.push({ x: (rnd() - .5) * 40, y: rnd() * 30, z: (rnd() - .5) * 20, v: 3 + rnd() * 5, s: rnd() * 6, a: rnd() * 6 });
  }
  confetti.instanceColor.needsUpdate = true;
  groupC.add(confetti);

  // how far the camera must be so a [w]-wide, [h]-tall thing fits the (portrait) screen
  function fitDistance(w, h, margin) {
    const v = THREE.MathUtils.degToRad(camera.fov) / 2;
    const hf = Math.atan(Math.tan(v) * camera.aspect);
    return Math.max((w / 2) * margin / Math.tan(hf), (h / 2) * margin / Math.tan(v));
  }

  const sections = cfg.sections; // {rise:[6,10], tunnel:[22,26], final:[35,43]}
  function inSec(bar, s) { return bar >= s[0] && bar < s[1]; }

  let readySent = false;
  let last = -1;
  function frame() {
    requestAnimationFrame(frame);
    let t = 0;
    try { t = B.time(); } catch (e) { return; }
    const bar = Math.floor(t / BAR);
    const A = inSec(bar, sections.rise), Bt = inSec(bar, sections.tunnel), C = inSec(bar, sections.final);
    const any = A || Bt || C;
    canvas.style.opacity = any ? '1' : '0';
    if (!any) { if (last !== -2) { renderer.clear(); last = -2; } return; }
    last = bar;
    groupA.visible = A; groupB.visible = Bt; groupC.visible = C;
    const k = kick(t);
    camera.fov = 55; camera.up.set(0, 1, 0);

    if (A) {
      const lt = t - sections.rise[0] * BAR;
      const orbitA = -1.25 + 1.25 * easeInOut(lt / 6.2);
      const fit = fitDistance(word.userData.w, word.userData.h + 9, 1.12);
      const rad = fit * (1.5 - 0.5 * easeInOut(lt / 6.5)) - (lt > 7 ? (lt - 7) * fit * 0.6 : 0);
      camera.position.set(Math.sin(orbitA) * rad, 9 - 8 * easeInOut(lt / 6), Math.cos(orbitA) * rad);
      camera.lookAt(0, -0.8, 0);
      placeVoxels(word, (d, o) => {
        const p = easeOutBack((lt - d.delay * 2.4) / 1.6);
        o.position.lerpVectors(d.start, d.target, clamp01(p) + (p > 1 ? p - 1 : 0));
        o.rotation.set(d.spin.x * (1 - clamp01(p)), d.spin.y * (1 - clamp01(p)), d.spin.z * (1 - clamp01(p)));
        const b = lt > 4 ? 1 + 0.22 * k * (0.5 + 0.5 * Math.sin(d.wave + t * 6)) : 1;
        o.scale.set(b, b, b);
      });
      placeVoxels(ver, (d, o) => {
        const p = easeOutExpo((lt - 4 - d.delay * 0.4) / 0.6);
        o.position.set(d.target.x, d.target.y, d.target.z + (1 - clamp01(p)) * 30);
        o.rotation.set(0, 0, 0);
        const s = clamp01(p); o.scale.set(s, s, s);
      });
      rim.intensity = 2 + 4 * k; under.intensity = 1.5 + 3 * k;
      grid.position.z = (t * 6) % 2;
      stars.rotation.y = t * 0.02;
    }

    if (Bt) {
      const lt = t - sections.tunnel[0] * BAR;
      const speed = 40 + 25 * k + 90 * Math.pow(clamp01((lt - 5) / 3), 2);
      const travel = lt * 45 + (lt > 5 ? Math.pow(lt - 5, 3) * 10 : 0);
      camera.position.set(Math.sin(t * 0.7) * 0.8, Math.cos(t * 0.5) * 0.6, -travel);
      camera.lookAt(camera.position.x * 0.5, camera.position.y * 0.5, -travel - 20);
      camera.up.set(Math.sin(t * 0.4) * 0.25, 1, 0);
      camera.fov = 60 + 45 * clamp01((lt - 5) / 3) + 6 * k;
      const span = RINGS * GAP;
      let i = 0;
      for (let r = 0; r < RINGS; r++) {
        // rings wrap around to stay ahead of the camera
        const z = -travel + 6 - ((((-travel + 6) + r * GAP) % span) + span) % span;
        const rot = t * (r % 2 ? 0.6 : -0.6) + r * 0.2;
        const radius = 7 + 0.8 * Math.sin(r * 0.7 + t * 2) + 1.2 * k;
        for (let q = 0; q < PER; q++) {
          const a = rot + q / PER * Math.PI * 2;
          dummy.position.set(Math.cos(a) * radius, Math.sin(a) * radius, z);
          dummy.rotation.set(0, 0, a);
          const s = 1 + 0.4 * k; dummy.scale.set(s, s, 1 + speed / 60);
          dummy.updateMatrix(); ringMesh.setMatrixAt(i++, dummy.matrix);
        }
      }
      ringMesh.instanceMatrix.needsUpdate = true;
      cards.forEach((m, j) => {
        const at = 0.35 + j * 0.62;             // when each card flies past
        const z = -(at * 45) - 24;
        m.position.set((j % 2 ? 1 : -1) * 2.2, (j % 3 - 1) * 1.6, z);
        m.lookAt(camera.position);
        m.visible = Math.abs(m.position.z - camera.position.z) < 70;
      });
      rim.position.copy(camera.position).add(new THREE.Vector3(0, 3, -12)); rim.intensity = 3 + 5 * k;
    }

    if (C) {
      const lt = t - sections.final[0] * BAR;
      const outro = Math.max(0, t - cfg.outro * BAR);
      const slam = easeOutExpo(lt / 0.45);
      const pull = easeInOut(outro / 4);
      const fitC = fitDistance(big.userData.w * 1.1, big.userData.h * 2.4, 1.15);
      camera.position.set(Math.sin(t * 0.25) * fitC * 0.18, -2 + 2 * pull, fitC * (1 + 0.3 * pull) + (1 - slam) * 10);
      camera.lookAt(0, 3.5, 0);
      if (lt < 0.5) { camera.position.x += (Math.random() - .5) * (1 - lt / .5) * 2.5; camera.position.y += (Math.random() - .5) * (1 - lt / .5) * 2.5; }
      big.position.set(0, 5.5, 0);
      big.rotation.y = Math.sin(t * 0.6) * 0.35;
      placeVoxels(big, (d, o) => {
        o.position.lerpVectors(d.start, d.target, clamp01(slam + d.delay * 0.02));
        const b = 1 + 0.28 * k * (0.6 + 0.4 * Math.sin(d.wave * 2 + t * 5));
        const s = (d.target.z < 0 ? 1.0 : b) * 1.6; o.scale.set(s, s, s);
        o.rotation.set(0, 0, 0);
      });
      orbit.position.set(0, 5.5, 0);
      orbit.rotation.y = -t * 0.8;
      placeVoxels(orbit, (d, o) => {
        const a = d.target.x / 9 + t * 0.4;
        const r = big.userData.w * 0.75;
        o.position.set(Math.cos(a) * r, d.target.y * 0.9 - 1, Math.sin(a) * r);
        o.rotation.set(0, -a, 0);
        const s = clamp01((lt - 1.2) / 0.6) * 0.55; o.scale.set(s, s, s);
      });
      for (let i = 0; i < CONF; i++) {
        const c = confData[i];
        const y = 22 - ((lt * c.v + c.y) % 34);
        dummy.position.set(c.x + Math.sin(lt + c.s) * 1.5, y, c.z);
        dummy.rotation.set(lt * c.a, lt * c.s, 0);
        const s = lt > 0.3 ? 1 : 0; dummy.scale.set(s, s, s);
        dummy.updateMatrix(); confetti.setMatrixAt(i, dummy.matrix);
      }
      confetti.instanceMatrix.needsUpdate = true;
      rim.position.set(-12, 10, 6); rim.intensity = 3 + 6 * k; under.intensity = 2 + 4 * k;
      canvas.style.opacity = String(1 - clamp01((outro - 2.8) / 1.2));
    }
    camera.updateProjectionMatrix();
    renderer.render(scene, camera);
    if (!readySent) { readySent = true; }
  }
  try {
    renderer.render(scene, camera);
    B.ready();
  } catch (e) { fail('first render: ' + e); return; }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
